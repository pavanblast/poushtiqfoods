name: Run TestNG Tests

on:
  push:
    branches: [ pavan_dev ]
  pull_request:
    branches: [ pavan_dev ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Maven 3.9.9
        run: |
          Invoke-WebRequest -Uri https://downloads.apache.org/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.zip -OutFile apache-maven-3.9.9-bin.zip
          Expand-Archive -Path apache-maven-3.9.9-bin.zip -DestinationPath $Env:ProgramFiles
          $env:MAVEN_HOME="$Env:ProgramFiles\apache-maven-3.9.9"
          $env:PATH="$env:MAVEN_HOME\bin;$env:PATH"

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run TestNG tests explicitly using testng.xml
        run: mvn test -DsuiteXmlFiles=testng.xml --no-transfer-progress -B
