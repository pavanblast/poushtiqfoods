name: Run TestNG Tests

on:
  push:
    branches: [ pavan_dev ]
  pull_request:
    branches: [ pavan_dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      - name: Set up Maven 3.9.9
        uses: s4u/setup-maven-action@v1.13.0
        with:
          maven-version: '3.9.9'


      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run TestNG tests
        run: mvn test --no-transfer-progress -B
